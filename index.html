    <!-- Start the big downloads immediately, in parallel with the JavaScript. Without this
         the avatar request could only begin after the whole JS bundle had downloaded and run. -->
    <link rel="preload" href="/fonts/shippori-mincho-b1-800.v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-var.v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/models/avatar.vrm" as="fetch" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Karthik Sengupta",
        "description": "MS Computer Science student at Northeastern University",
        "url": "https://karthik-sengupta.vercel.app/",
        "email": "mailto:sengupta.k@northeastern.edu",
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Northeastern University" },
        "sameAs": ["https://github.com/kartsen03", "https://www.linkedin.com/in/karthik-sengupta"]
      }
    </script>

    <!-- Pick the theme before first paint so the splash never flashes the wrong colours. -->
    <script>
      ;(function () {
        var theme = 'golden'
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var saved = JSON.parse(localStorage.getItem('ks-portfolio-settings-v1') || '{}').theme
          theme = q === 'twilight' || q === 'golden' ? q : saved === 'twilight' ? 'twilight' : 'golden'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <style>
      /* Critical styles: just enough for the splash to paint instantly and correctly
         before the main stylesheet arrives. */
      @font-face {
        font-family: 'Shippori Mincho B1';
        src: url('/fonts/shippori-mincho-b1-800.v1.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
        /* block: a few hundred ms of invisible name beats a flash of a fallback serif */
        font-display: block;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        src: url('/fonts/ibm-plex-sans-var.v1.woff2') format('woff2-variations'), url('/fonts/ibm-plex-sans-var.v1.woff2') format('woff2');
        font-weight: 100 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --sky-top: #2f62b8;
        --sky-mid: #79aee6;
        --sky-low: #ffd7a3;
        --name: #fff8ee;
        --name-glow: rgba(255, 196, 140, 0.55);
        --splash-ink: #fff8ee;
        --splash-muted: rgba(255, 248, 238, 0.78);
        --vermilion: #c8442b;
        --font-display: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
        --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      }
      :root[data-theme='twilight'] {
        --sky-top: #0b0f2e;
        --sky-mid: #232a63;
        --sky-low: #c86f7e;
        --name: #ffeed6;
        --name-glow: rgba(255, 176, 102, 0.6);
        --splash-ink: #fbefdc;
        --splash-muted: rgba(251, 239, 220, 0.74);
        --vermilion: #e0583a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--sky-low);
      }
      body {
        overflow: hidden;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      .splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: max(24px, env(safe-area-inset-top)) clamp(20px, 5vw, 72px) max(28px, env(safe-area-inset-bottom));
        color: var(--splash-ink);
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 46%, var(--sky-low) 100%);
        transition: opacity 900ms cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 900ms;
      }
      .splash[data-state='leaving'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash__top {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--splash-muted);
      }
      .seal {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 4px;
        background: var(--vermilion);
        color: #fff6ea;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0;
        box-shadow: inset 0 0 0 1.5px rgba(255, 246, 234, 0.55);
      }
      .splash__center {
        align-self: center;
      }
      .splash__name {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(3.1rem, 12.5vw, 11.5rem);
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: var(--name);
        text-shadow: 0 0 42px var(--name-glow), 0 2px 0 rgba(0, 0, 0, 0.04);
      }
      .splash__name span {
        display: block;
        animation: rise 1100ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash__name span + span {
        animation-delay: 140ms;
        padding-left: 0.5em;
      }
      .splash__role {
        margin: clamp(14px, 2.4vw, 28px) 0 0;
        font-size: clamp(0.95rem, 1.6vw, 1.15rem);
        font-weight: 450;
        letter-spacing: 0.02em;
        color: var(--splash-muted);
        animation: fade 1200ms 380ms ease-out both;
      }
      .splash__kanji {
        position: absolute;
        right: clamp(16px, 4vw, 56px);
        top: 50%;
        transform: translateY(-50%);
        writing-mode: vertical-rl;
        font-family: var(--font-display);
        font-size: 15px;
        letter-spacing: 0.6em;
        color: var(--splash-muted);
        opacity: 0.7;
      }
      .splash__bottom {
        display: grid;
        gap: 16px;
        max-width: 560px;
      }
      .splash__status {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--splash-muted);
      }
      .splash__bar {
        height: 1px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
      }
      .splash__bar i {
        display: block;
        height: 100%;
        width: 100%;
        background: var(--splash-ink);
        transform-origin: 0 50%;
        transform: scaleX(var(--progress, 0));
        transition: transform 300ms ease-out;
      }
      .splash__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 22px;
      }
      .splash__enter {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 14px 26px;
        min-height: 48px;
        font: 600 15px/1 var(--font-ui);
        letter-spacing: 0.02em;
        color: #fff6ea;
        background: var(--vermilion);
        box-shadow: 0 10px 30px -12px rgba(120, 30, 10, 0.6);
        cursor: pointer;
        transition: transform 200ms ease, opacity 300ms ease, box-shadow 200ms ease;
      }
      .splash__enter:disabled {
        opacity: 0.45;
        cursor: progress;
      }
      .splash__enter:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 34px -12px rgba(120, 30, 10, 0.7);
      }
      .splash__quick {
        color: var(--splash-ink);
        font-size: 15px;
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 1px;
      }
      .splash :focus-visible {
        outline: 2px solid var(--splash-ink);
        outline-offset: 4px;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.35em);
          clip-path: inset(0 0 100% 0);
        }
        to {
          opacity: 1;
          transform: none;
          clip-path: inset(0 0 -10% 0);
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__name span,
        .splash__role {
          animation: none;
        }
        .splash {
          transition: opacity 200ms linear, visibility 0s linear 200ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" data-state="loading">
      <div class="splash__top" aria-hidden="true">
        <span class="seal">KS</span>
        <span>Portfolio · 2026</span>
      </div>
      <div class="splash__center">
        <h1 class="splash__name" aria-label="Karthik Sengupta"><span>Karthik</span><span>Sengupta</span></h1>
        <p class="splash__role">MS Computer Science, Northeastern · ML, GPU systems &amp; real-time graphics</p>
      </div>
      <div class="splash__kanji" aria-hidden="true">空の島</div>
      <div class="splash__bottom">
        <div class="splash__bar" aria-hidden="true"><i></i></div>
        <div class="splash__status">
          <span id="splash-status" role="status">Raising the island…</span>
          <span id="splash-pct" aria-hidden="true"></span>
        </div>
        <div class="splash__actions">
          <button class="splash__enter" id="splash-enter" type="button" disabled>Enter the island</button>
          <a class="splash__quick" id="splash-quick" href="#quick">Read the text version</a>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <noscript>

        <a href="/resume.pdf">Résumé (PDF)</a> ·
        <a href="mailto:sengupta.k@northeastern.edu">Email</a>

    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
